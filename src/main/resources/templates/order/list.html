<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<body>

<section layout:fragment="main-content" class="orders">

    <p class="eyebrow" th:text="#{order.history}"></p>
    <h1 th:text="#{order.title}"></h1>

    <th:block th:if="${#lists.isEmpty(orders)}">
        <p th:text="#{order.empty}"></p>
        <a class="btn btn--primary btn--small"
           th:href="@{/catalogue}"
           th:text="#{order.viewCatalogue}"></a>
    </th:block>

    <th:block th:unless="${#lists.isEmpty(orders)}">
        <table>
            <thead>
            <tr>
                <th th:text="#{common.number}"></th>
                <th th:text="#{common.date}"></th>
                <th th:text="#{order.initialPrice}"></th>
                <th th:text="#{common.discount}"></th>
                <th th:text="#{common.total}"></th>
                <th th:text="#{common.status}"></th>
                <th th:text="#{common.action}"></th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}"></td>

                <td th:text="|${#temporals.format(order.createdAt, 'dd/MM/yyyy')} #{common.at} ${#temporals.format(order.createdAt, 'HH:mm')}|"></td>

                <td th:text="|${order.originalPrice} €|"></td>

                <td th:text="${order.discountAmount != null and order.discountAmount.signum() > 0} ? |- ${order.discountAmount} €| : #{common.none}"></td>

                <td><strong th:text="|${order.totalPrice} €|"></strong></td>

                <td>
                    <span th:class="${order.status == 'PAID'} ? 'success' : 'error'"
                          th:text="${order.status == 'PAID'} ? #{order.status.paid} : #{order.status.pending_payment}"></span>
                </td>

                <td>
                    <a class="btn btn--primary btn--full"
                       th:href="@{/order/{id}(id=${order.id})}"
                       th:text="#{common.details}"></a>

                    <form th:if="${order.status != 'PAID'}"
                          method="post"
                          th:action="@{/order/{id}/cancel(id=${order.id})}">
                        <button type="submit"
                                class="btn btn--delete btn--full"
                                th:text="#{order.cancel}"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <a class="btn btn--primary btn--full"
           th:href="@{/catalogue}"
           th:text="#{common.backCatalogue}"></a>
    </th:block>

</section>

</body>
</html>
