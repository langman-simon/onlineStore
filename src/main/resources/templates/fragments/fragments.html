<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header th:fragment="header" class="navbar">
    <div class="container navbar__container">

        <div class="header-language">
            <div class="hover-menu">
                <span class="language-button" aria-hidden="true">
                    <span aria-hidden="true">🌐</span>
                    <span class="language-button__label" th:text="#{common.language}">Langue</span>
                </span>

                <div class="hover-menu__content language-dropdown">
                    <a th:href="${frUrl}" lang="fr" hreflang="fr">
                        <img th:src="@{/images/flags/fr.png}" alt="">
                        <th:block th:text="#{common.french}">Français</th:block>
                    </a>
                    <a th:href="${enUrl}" lang="en" hreflang="en">
                        <img th:src="@{/images/flags/en.png}" alt="">
                        <th:block th:text="#{common.english}">English</th:block>
                    </a>
                </div>
            </div>
        </div>

        <div class="header-navigation" id="headerNavigation">
            <a th:href="@{/}" class="header-brand"
               th:attr="aria-label=#{header.brandAria}">Hyperion</a>

            <nav class="header-links" th:attr="aria-label=#{header.navigationAria}">
                <a th:href="@{/}" th:text="#{common.home}">Accueil</a>
                <a th:href="@{/catalogue}" th:text="#{common.catalogue}">Catalogue</a>
                <a th:href="@{/company}" th:text="#{common.company}">Société</a>

                <a th:href="@{/cart}" class="header-cart-link">
                    <th:block th:text="#{header.cart}">Panier</th:block>
                    <span class="header-cart-count"
                          th:text="${sessionCart.cart.totalQuantity}">0</span>
                </a>

                <a sec:authorize="isAuthenticated()" th:href="@{/order}"
                   th:text="#{header.orders}">Commandes</a>

                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}"
                   th:text="#{common.admin}">Admin</a>
            </nav>
        </div>

        <div class="header-user">

            <div sec:authorize="isAnonymous()" class="hover-menu">
                <span class="user-avatar user-avatar--anonymous" aria-hidden="true">?</span>
                <div class="hover-menu__content user-dropdown">
                    <a th:href="@{/login}" th:text="#{header.login}">Connexion</a>
                    <a th:href="@{/register}" th:text="#{header.register}">Inscription</a>
                </div>
            </div>

            <div sec:authorize="isAuthenticated()" class="hover-menu">
                <span class="user-avatar" aria-hidden="true"
                      th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 1))}">U</span>

                <div class="hover-menu__content user-dropdown">
                    <p class="user-dropdown__login" sec:authentication="name">login</p>
                    <a th:href="@{/order}" th:text="#{header.orders}">Commandes</a>
                    <a th:href="@{/account}" th:text="#{header.account}">Mon compte</a>
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}"
                       th:text="#{common.admin}">Admin</a>

                    <form method="post" th:action="@{/logout}">
                        <button type="submit" th:text="#{header.logout}">Déconnexion</button>
                    </form>
                </div>
            </div>
        </div>

    </div>
</header>

<div th:fragment="banner"
     th:if="${globalBannerMessage != null}"
     id="global-banner"
     th:class="|global-banner global-banner--${globalBannerType}|"
     role="status" aria-live="polite" tabindex="0"
     th:attr="aria-label=#{common.bannerAria}">

    <span class="global-banner__icon" aria-hidden="true"
          th:text="${globalBannerType == 'success'} ? '✓' : (${globalBannerType == 'error' or globalBannerType == 'warning'} ? '!' : 'i')">i</span>

    <span class="global-banner__message" th:text="${globalBannerMessage}">Message</span>

    <span class="global-banner__hint" aria-hidden="true" th:text="#{common.close}">Fermer</span>

    <div class="global-banner__timer" aria-hidden="true"></div>
</div>

<footer th:fragment="footer" class="footer">
    <div class="container">
        <div class="ornament-divider"><span></span></div>
        <p class="footer-tagline">Hyperion Industries</p>
        <p>© 2026 Hyperion — <span th:text="#{footer.rights}">Tous droits réservés</span></p>
    </div>
</footer>

</body>
</html>
