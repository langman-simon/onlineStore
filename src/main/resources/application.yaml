spring:
  application:
    name: Hyperion

  datasource:
    url: jdbc:postgresql://localhost:5432/hyperion
    username: postgres
    password: mdp
    driver-class-name: org.postgresql.Driver

  server:
    servlet:
      encoding:
        charset: UTF-8
        enabled: true
        force: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update

  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp