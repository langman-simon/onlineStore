spring:
  application:
    name: Hyperion

  datasource:
    url: jdbc:postgresql://localhost:5432/hyperion
    username: postgres
    password: mdp
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update

  sql:
    init:
      mode: always
      encoding: UTF-8

  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  base-url: http://localhost:8080

